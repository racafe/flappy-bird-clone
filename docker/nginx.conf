server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # File names are not hashed: always revalidate.
    add_header Cache-Control "no-cache";

    # Same as the old static build: any unknown path serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
