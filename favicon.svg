<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#4ec0ca"/>

  <!-- Bird body -->
  <ellipse cx="15" cy="17" rx="7" ry="6" fill="#ffe75c" stroke="#e0b94a" stroke-width="1.5"/>

  <!-- Wing -->
  <ellipse cx="13" cy="18" rx="3.5" ry="3" fill="#ffcc40" stroke="#e0b94a" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="18" cy="15" r="2.4" fill="#ffffff"/>
  <circle cx="18.6" cy="15.2" r="1.1" fill="#333333"/>

  <!-- Beak -->
  <polygon points="21,16 26,17.5 21,19" fill="#ff9933" stroke="#e07a1d" stroke-width="1" stroke-linejoin="round"/>

  <!-- Ground hint -->
  <rect x="0" y="26" width="32" height="6" fill="#ded895"/>
  <rect x="0" y="26" width="32" height="3" fill="#c9c270"/>
</svg>
